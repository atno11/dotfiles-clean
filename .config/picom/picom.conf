backend = "xrender";

vsync = false;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -8;
shadow-offset-y = -8;

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

detect-client-opacity = true;
detect-rounded-corners = true;
detect-transient = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

use-damage = true;

log-level = "warn";
